name: Build (Windows)

on:
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

jobs:
  build:
    name: build windows
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'build'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # 前端资源由 //go:embed all:out 在编译时打入二进制，
      # 但 .gitignore 忽略了 static/out/*，CI 干净 checkout 后该目录为空，
      # 必须先 pnpm build 生成 web/out 并移动到 static/out，否则网页空白。
      - name: Build frontend
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          NEXT_PUBLIC_APP_VERSION="$(git describe --tags --abbrev=0 2>/dev/null || echo 'dev')" pnpm build

      - name: Embed frontend into static
        run: |
          rm -rf static/out
          mv web/out static/out

      - name: Build Windows binary
        run: |
          set -e
          mkdir -p build/bin
          BUILD_TIME="$(TZ='Asia/Shanghai' date +'%F %T %z')"
          GIT_VERSION="$(git describe --tags --abbrev=0 2>/dev/null || echo 'dev')"
          COMMIT_ID="$(git rev-parse --short HEAD)"
          LDFLAGS="-X 'github.com/bestruirui/octopus/internal/conf.Version=${GIT_VERSION}' \
                   -X 'github.com/bestruirui/octopus/internal/conf.BuildTime=${BUILD_TIME}' \
                   -X 'github.com/bestruirui/octopus/internal/conf.Author=${{ github.repository_owner }}' \
                   -X 'github.com/bestruirui/octopus/internal/conf.Commit=${COMMIT_ID}' \
                   -X 'github.com/bestruirui/octopus/internal/conf.Repo=https://github.com/${{ github.repository }}' \
                   -s -w"
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o build/bin/octopus-windows-x86_64.exe -ldflags="${LDFLAGS}" -tags=jsoniter ./

      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: octopus-windows-${{ github.sha }}
          path: build/bin/
          retention-days: 7
          if-no-files-found: error
