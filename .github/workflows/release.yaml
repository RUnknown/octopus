name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 要发布的现有 v* 标签
        required: true
        type: string

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: release windows
    runs-on: ubuntu-latest
    steps:
      # GHCR 镜像名必须全小写，GitHub Actions 无 downcase 函数，用 Bash 参数扩展写入 env
      - name: Compute lowercase repo
        shell: bash
        run: |
          echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> "${GITHUB_ENV}"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Validate release tag
        shell: bash
        run: |
          case "${RELEASE_TAG}" in
            v*) ;;
            *) echo "发布标签必须以 v 开头：${RELEASE_TAG}" >&2; exit 1 ;;
          esac
          git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}"

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # 前端资源由 //go:embed all:out 在编译时打入二进制，
      # 但 .gitignore 忽略了 static/out/*，CI 干净 checkout 后该目录为空，
      # 必须先 pnpm build 生成 web/out 并移动到 static/out，否则网页空白。
      - name: Build frontend
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          NEXT_PUBLIC_APP_VERSION="${RELEASE_TAG}" \
          NEXT_PUBLIC_GITHUB_REPO="https://github.com/${{ github.repository }}" \
          pnpm build

      - name: Embed frontend into static
        run: |
          rm -rf static/out
          mv web/out static/out

      - name: Build Windows binary
        run: |
          set -e
          mkdir -p build/bin
          BUILD_TIME="$(TZ='Asia/Shanghai' date +'%F %T %z')"
          COMMIT_ID="$(git rev-parse --short HEAD)"
          LDFLAGS="-X 'github.com/bestruirui/octopus/internal/conf.Version=${RELEASE_TAG}' \
                   -X 'github.com/bestruirui/octopus/internal/conf.BuildTime=${BUILD_TIME}' \
                   -X 'github.com/bestruirui/octopus/internal/conf.Author=${{ github.repository_owner }}' \
                   -X 'github.com/bestruirui/octopus/internal/conf.Commit=${COMMIT_ID}' \
                   -X 'github.com/bestruirui/octopus/internal/conf.Repo=https://github.com/${{ github.repository }}' \
                   -s -w"
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o build/bin/octopus-windows-x86_64.exe -ldflags="${LDFLAGS}" -tags=jsoniter ./

      # 与项目1 (build.sh create_archives) 打包规范对齐：
      # 二进制统一重命名为 octopus.exe，并附带 README.md 与 LICENSE
      - name: Archive binaries
        shell: bash
        run: |
          set -e
          mkdir -p build/archives
          cp build/bin/octopus-windows-x86_64.exe build/archives/octopus.exe
          cp README.md build/archives/README.md
          cp LICENSE build/archives/LICENSE
          (cd build/archives && zip -q octopus-windows-x86_64.zip octopus.exe README.md LICENSE)
          rm -f build/archives/octopus.exe build/archives/README.md build/archives/LICENSE

      - name: Generate changelog
        shell: bash
        run: |
          set -e
          PREVIOUS_TAG="$(git describe --tags --abbrev=0 "${RELEASE_TAG}^" 2>/dev/null || true)"
          {
            echo "## 更新日志"
            echo
            if [ -n "${PREVIOUS_TAG}" ]; then
              echo "相较于 ${PREVIOUS_TAG}："
              git log --no-merges --pretty=format:'- %s（%h）' "${PREVIOUS_TAG}..${RELEASE_TAG}"
            else
              echo "- 首次发布。"
            fi
            echo
            echo
            echo "## 下载"
            echo
            echo "- Windows (amd64)：\`octopus-windows-x86_64.zip\`"
            echo "- Docker (Debian)：\`ghcr.io/${REPO_LC}:${RELEASE_TAG}\`"
            echo "- Docker (Alpine)：\`ghcr.io/${REPO_LC}:${RELEASE_TAG}-alpine\`"
          } > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/archives/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: false
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: release-notes.md

  docker:
    name: release docker (multi-arch)
    runs-on: ubuntu-latest
    steps:
      # GHCR 镜像名必须全小写，GitHub Actions 无 downcase 函数，用 Bash 参数扩展写入 env
      - name: Compute lowercase repo
        shell: bash
        run: |
          echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> "${GITHUB_ENV}"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Validate release tag
        shell: bash
        run: |
          case "${RELEASE_TAG}" in
            v*) ;;
            *) echo "发布标签必须以 v 开头：${RELEASE_TAG}" >&2; exit 1 ;;
          esac
          git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}"

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # 前端资源由 //go:embed all:out 在编译时打入二进制，
      # 但 .gitignore 忽略了 static/out/*，CI 干净 checkout 后该目录为空，
      # 必须先 pnpm build 生成 web/out 并移动到 static/out，否则网页空白。
      - name: Build frontend
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          NEXT_PUBLIC_APP_VERSION="${RELEASE_TAG}" \
          NEXT_PUBLIC_GITHUB_REPO="https://github.com/${{ github.repository }}" \
          pnpm build

      - name: Embed frontend into static
        run: |
          rm -rf static/out
          mv web/out static/out

      # 构建 Docker 所需的 Linux 二进制（4 平台），供两个 Dockerfile COPY 使用。
      # .gitignore 忽略 build 目录，但此处与 COPY 处于同一 job，先构建后 COPY 不受影响。
      - name: Build Linux binaries for Docker
        run: |
          set -e
          mkdir -p build/docker/linux/amd64 build/docker/linux/386 build/docker/linux/arm64 build/docker/linux/arm/v7
          BUILD_TIME="$(TZ='Asia/Shanghai' date +'%F %T %z')"
          COMMIT_ID="$(git rev-parse --short HEAD)"
          LDFLAGS="-X 'github.com/bestruirui/octopus/internal/conf.Version=${RELEASE_TAG}' \
                   -X 'github.com/bestruirui/octopus/internal/conf.BuildTime=${BUILD_TIME}' \
                   -X 'github.com/bestruirui/octopus/internal/conf.Author=${{ github.repository_owner }}' \
                   -X 'github.com/bestruirui/octopus/internal/conf.Commit=${COMMIT_ID}' \
                   -X 'github.com/bestruirui/octopus/internal/conf.Repo=https://github.com/${{ github.repository }}' \
                   -s -w"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags=jsoniter -ldflags="${LDFLAGS}" -o build/docker/linux/amd64/octopus .
          CGO_ENABLED=0 GOOS=linux GOARCH=386 go build -tags=jsoniter -ldflags="${LDFLAGS}" -o build/docker/linux/386/octopus .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -tags=jsoniter -ldflags="${LDFLAGS}" -o build/docker/linux/arm64/octopus .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -tags=jsoniter -ldflags="${LDFLAGS}" -o build/docker/linux/arm/v7/octopus .

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Alpine image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: scripts/dockerfiles/Dockerfile.alpine
          push: true
          platforms: linux/amd64,linux/386,linux/arm64,linux/arm/v7
          tags: |
            ghcr.io/${{ env.REPO_LC }}:latest-alpine
            ghcr.io/${{ env.REPO_LC }}:${{ env.RELEASE_TAG }}-alpine
          provenance: false

      - name: Build and push Debian image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: scripts/dockerfiles/Dockerfile.debian
          push: true
          platforms: linux/amd64,linux/386,linux/arm64,linux/arm/v7
          tags: |
            ghcr.io/${{ env.REPO_LC }}:latest
            ghcr.io/${{ env.REPO_LC }}:${{ env.RELEASE_TAG }}
          provenance: false
