name: 发布 Docker 镜像

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 要发布的现有 v* 标签
        required: true
        type: string

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

permissions:
  contents: write
  packages: write

jobs:
  docker:
    name: 发布 Docker（多架构）
    runs-on: ubuntu-latest
    steps:
      - name: 检出发布标签
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: 校验发布标签
        shell: bash
        run: |
          case "${RELEASE_TAG}" in
            v*) ;;
            *) echo "发布标签必须以 v 开头：${RELEASE_TAG}" >&2; exit 1 ;;
          esac
          git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}"

      - name: 设置 Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: 设置 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: 构建前端
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          NEXT_PUBLIC_APP_VERSION="${RELEASE_TAG}" \
          NEXT_PUBLIC_GITHUB_REPO="https://github.com/${{ github.repository }}" \
          pnpm build

      - name: 嵌入前端静态文件
        run: |
          rm -rf static/out
          mv web/out static/out

      - name: 构建 Docker 所需的 Linux 二进制
        run: |
          set -e
          mkdir -p build/docker/linux/amd64 build/docker/linux/386 build/docker/linux/arm64 build/docker/linux/arm/v7
          BUILD_TIME="$(TZ='Asia/Shanghai' date +'%F %T %z')"
          COMMIT_ID="$(git rev-parse --short HEAD)"
          LDFLAGS="-X 'github.com/bestruirui/octopus/internal/conf.Version=${RELEASE_TAG}' \
                   -X 'github.com/bestruirui/octopus/internal/conf.BuildTime=${BUILD_TIME}' \
                   -X 'github.com/bestruirui/octopus/internal/conf.Author=${{ github.repository_owner }}' \
                   -X 'github.com/bestruirui/octopus/internal/conf.Commit=${COMMIT_ID}' \
                   -X 'github.com/bestruirui/octopus/internal/conf.Repo=https://github.com/${{ github.repository }}' \
                   -s -w"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags=jsoniter -ldflags="${LDFLAGS}" -o build/docker/linux/amd64/octopus .
          CGO_ENABLED=0 GOOS=linux GOARCH=386 go build -tags=jsoniter -ldflags="${LDFLAGS}" -o build/docker/linux/386/octopus .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -tags=jsoniter -ldflags="${LDFLAGS}" -o build/docker/linux/arm64/octopus .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -tags=jsoniter -ldflags="${LDFLAGS}" -o build/docker/linux/arm/v7/octopus .

      - name: 设置 QEMU
        uses: docker/setup-qemu-action@v3

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送 Alpine Docker 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: scripts/dockerfiles/Dockerfile.alpine
          push: true
          platforms: linux/amd64,linux/386,linux/arm64,linux/arm/v7
          tags: |
            ghcr.io/${{ github.repository }}:latest-alpine
            ghcr.io/${{ github.repository }}:${{ env.RELEASE_TAG }}-alpine
          provenance: false

      - name: 构建并推送 Debian Docker 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: scripts/dockerfiles/Dockerfile.debian
          push: true
          platforms: linux/amd64,linux/386,linux/arm64,linux/arm/v7
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ env.RELEASE_TAG }}
          provenance: false

      - name: 生成更新日志
        shell: bash
        run: |
          set -e
          PREVIOUS_TAG="$(git describe --tags --abbrev=0 "${RELEASE_TAG}^" 2>/dev/null || true)"
          {
            echo "## 更新日志"
            echo
            if [ -n "${PREVIOUS_TAG}" ]; then
              echo "相较于 ${PREVIOUS_TAG}："
              git log --no-merges --pretty=format:'- %s（%h）' "${PREVIOUS_TAG}..${RELEASE_TAG}"
            else
              echo "- 首次发布。"
            fi
            echo
            echo
            echo "## Docker 镜像"
            echo
            echo "- Debian：\`ghcr.io/${{ github.repository }}:${RELEASE_TAG}\`"
            echo "- Alpine：\`ghcr.io/${{ github.repository }}:${RELEASE_TAG}-alpine\`"
          } > release-notes.md

      - name: 创建 GitHub Release 与更新日志（无二进制附件）
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: release-notes.md
